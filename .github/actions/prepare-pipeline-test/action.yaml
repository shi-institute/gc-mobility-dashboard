name: "Test Data Pipeline"
description: "Loads docker images and sets up the environment for data pipeline tests. This action is used in the test workflow to prepare the environment for running tests on the data pipeline."
author: jackbuehner
branding:
  icon: "anchor"
  color: "gray-dark"

inputs:
  bigquery_credentials:
    description: "Credentials JSON for pandas-gbq"
    required: false
  encrypted_bigquery_credentials:
    description: "Encrypted credentials JSON from the authenticate-gbq action. Used when bigquery_credentials is empty."
    required: false
  credentials_encryption_key:
    description: "Passphrase used to decrypt encrypted_bigquery_credentials"
    required: false
  etls:
    description: "ETL files to run"
    required: false
  input_dir:
    description: "Input directory for the data pipeline"
    required: false
  artifact_name:
    description: "Name of the artifact created from the output data"
    required: false

runs:
  using: "composite"
  steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v8
      with:
        name: docker-image-data-pipeline
        path: .

    - name: Load Docker image from artifact
      run: |
        docker load -i ./gc-mobility-dashboard-data-pipeline.tar
        rm ./gc-mobility-dashboard-data-pipeline.tar
      shell: bash

    - name: Run test
      env:
        BIGQUERY_CREDENTIALS: ${{ inputs.bigquery_credentials }}
        ENCRYPTED_BIGQUERY_CREDENTIALS: ${{ inputs.encrypted_bigquery_credentials }}
        CREDENTIALS_ENCRYPTION_KEY: ${{ inputs.credentials_encryption_key }}
        INPUT_DIR: ${{ inputs.input_dir }}
        ETLS: ${{ inputs.etls }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
      run: |
        cd ${{ github.action_path }}

        # if credentials were not provided directly, decrypt the credentials
        # from the authenticate-gbq action
        if [ -z "$BIGQUERY_CREDENTIALS" ] && [ -n "$ENCRYPTED_BIGQUERY_CREDENTIALS" ]; then
          if [ -z "$CREDENTIALS_ENCRYPTION_KEY" ]; then
            echo "::error::encrypted_bigquery_credentials was provided without credentials_encryption_key."
            exit 1
          fi
          BIGQUERY_CREDENTIALS=$(printf '%s' "$ENCRYPTED_BIGQUERY_CREDENTIALS" \
            | openssl enc -d -aes-256-cbc -pbkdf2 -base64 -A -pass env:CREDENTIALS_ENCRYPTION_KEY) || {
            echo "::error::Failed to decrypt BigQuery credentials."
            exit 1
          }
        fi

        # mask the sensitive credential values so they are redacted from all logs in this job
        if [ -n "$BIGQUERY_CREDENTIALS" ]; then
          if ! command -v jq > /dev/null; then
            echo "::error::jq is required to mask BigQuery credentials."
            exit 1
          fi
          for FIELD in refresh_token client_secret; do
            VALUE=$(printf '%s' "$BIGQUERY_CREDENTIALS" | jq -r --arg f "$FIELD" '.[$f] // empty' 2>/dev/null)
            [ -n "$VALUE" ] && echo "::add-mask::$VALUE"
          done
        fi
        unset ENCRYPTED_BIGQUERY_CREDENTIALS CREDENTIALS_ENCRYPTION_KEY

        BIGQUERY_CREDENTIALS=$BIGQUERY_CREDENTIALS \
          INPUT_DIR=$INPUT_DIR \
          ETLS=$ETLS \
          ARTIFACT_NAME=$ARTIFACT_NAME \
          IS_GH_WORKFLOW=true \
          ./run.sh
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: /tmp/artifacts/${{ inputs.artifact_name }}
        retention-days: 30
